# List of Jarvis projects
jarvis_projects:
  - name: "Linux Cluster Monitoring Agent"
    git_url: "/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: Analyzed infrastructure monitoring requirements and supported the design of a Linux-based system to track CPU, memory, disk, and host metrics across multiple nodes. Implemented Bash scripts and automated data collection using cron, validated system outputs, and stored metrics in a PostgreSQL database deployed via Docker. Used SQL to verify data accuracy and support system monitoring, capacity planning, and operational analysis.
  - name: "RDBMS and SQL Implementation"
    git_url: "https://github.com/jarviscanada/jarvis_data_eng_TaiyabaKhatoon/tree/main/sql"
    description: Supported the design and implementation of a relational database system to meet analytical and reporting requirements. Analyzed data needs, designed normalized schemas, validated table relationships using primary and foreign keys, and tested system behavior through complex SQL queries. Deployed the database using Docker and ensured data integrity, performance, and alignment with business use cases.
  - name: "Python Data Analytics  London Gift Shop"
    git_url: "https://github.com/jarviscanada/jarvis_data_eng_TaiyabaKhatoon/tree/main/python_data_analytics"
    description: Analyzed retail transaction data using Python (Pandas, NumPy, Matplotlib) to identify sales trends and customer purchasing behavior. Cleaned and transformed raw data, performed exploratory analysis, and applied RFM segmentation to identify high-value customer groups and seasonal sales patterns to support data-driven business decisions.
  - name: "Business Requirements Document for Linux Cluster Monitoring Agent"
    git_url: "https://github.com/jarviscanada/jarvis_data_eng_TaiyabaKhatoon/blob/main/bsa/BRD.pdf"
    description: Conducted business analysis to define requirements for a Linux-based monitoring solution that automates the collection of hardware and resource usage metrics across cluster nodes. Identified the business problem, defined project scope and stakeholder needs, and documented functional and non-functional requirements. Produced a Business Requirements Document outlining monitoring objectives, implementation approach, and MVP delivery for centralized system performance monitoring.
  - name: "Software Requirements Document for Retail Stock Trading Application"
    git_url: "https://github.com/jarviscanada/jarvis_data_eng_TaiyabaKhatoon/blob/main/bsa/SRD.pdf"
    description: Conducted stakeholder elicitation to gather business and system requirements for a retail stock trading platform designed for independent investors. Analyzed business objectives and translated them into structured system requirements, including user stories, use case interactions, trading workflows, and data model design. Developed a comprehensive Software Requirements Document defining functional and non-functional requirements, system architecture, infrastructure considerations, and project timeline for a scalable platform supporting stock search, portfolio monitoring, and buy/sell trading operations.   
